name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project scaffolding
        run: flutter create --project-name cosmo_kundli .

      - name: Fix Android build configuration
        run: |
          # Fix settings.gradle or settings.gradle.kts
          for f in android/settings.gradle android/settings.gradle.kts; do
            [ -f "$f" ] && {
              sed -i -E 's/(id\("com\.android\.application"\) version ")[^"]+/\19.1.1/' "$f"
              sed -i -E 's/(id "com\.android\.application" version ")[^"]+/\19.1.1/' "$f"
              sed -i -E 's/(id\("org\.jetbrains\.kotlin\.android"\) version ")[^"]+/\12.4.20/' "$f"
              sed -i -E 's/(id "org\.jetbrains\.kotlin\.android" version ")[^"]+/\12.4.20/' "$f"
            }
          done
          # Fix gradle wrapper
          for f in android/gradle/wrapper/gradle-wrapper.properties; do
            [ -f "$f" ] && {
              sed -i -E 's|gradle-[0-9.]+-all\.zip|gradle-9.3.1-all.zip|' "$f"
              sed -i -E 's|gradle-[0-9.]+-bin\.zip|gradle-9.3.1-bin.zip|' "$f"
            }
          done

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CosmoKundli-APK
          path: build/app/outputs/flutter-apk/app-release.apk
