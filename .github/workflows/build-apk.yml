name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project scaffolding
        run: flutter create --project-name cosmo_kundli .

      - name: Fix Android build configuration
        run: |
          # 1. Force Gradle 9.3.1 (flutter create generates 8.x which is too old)
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'GWEOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
          GWEOF

          # 2. Force settings.gradle.kts with correct AGP 9.1.1 and Kotlin 2.4.20
          #    Remove any Groovy settings.gradle that flutter create/build generates
          rm -f android/settings.gradle
          cat > android/settings.gradle.kts << 'SKEOF'
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }

              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "9.1.1" apply false
              id("org.jetbrains.kotlin.android") version "2.4.20" apply false
          }

          include(":app")
          SKEOF

          # 3. Fix build.gradle.kts: replace flutter.compileSdkVersion with literal 37
          python3 -c "
          import re
          with open('android/app/build.gradle.kts', 'r') as f:
              content = f.read()
          content = content.replace('flutter.compileSdkVersion', '37')
          content = content.replace('flutter.minSdkVersion', '24')
          content = content.replace('flutter.targetSdkVersion', '34')
          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(content)
          "

          # 4. Debug: show what we have
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== settings.gradle.kts ==="
          cat android/settings.gradle.kts
          echo "=== build.gradle.kts compileSdk line ==="
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CosmoKundli-APK
          path: build/app/outputs/flutter-apk/app-release.apk
