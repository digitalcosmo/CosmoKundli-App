name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project scaffolding
        run: flutter create --project-name cosmo_kundli .

      - name: Fix Android Gradle Plugin version
        run: |
          # Update AGP to 8.5.2+ for Kotlin compatibility
          sed -i "s/id \"com.android.application\" version \"[^\"]*\"/id \"com.android.application\" version \"8.7.0\"/" android/settings.gradle
          sed -i "s/id \"org.jetbrains.kotlin.android\" version \"[^\"]*\"/id \"org.jetbrains.kotlin.android\" version \"2.1.0\"/" android/settings.gradle
          # Also update build.gradle if it has classpath reference
          sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.7.0/' android/build.gradle 2>/dev/null || true
          sed -i 's/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.7.0/' android/app/build.gradle 2>/dev/null || true
          # Update gradle wrapper
          cd android && ./gradlew wrapper --gradle-version 8.9 2>/dev/null || true
          cd ..
          # Set compileSdk and targetSdk to 35
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CosmoKundli-APK
          path: build/app/outputs/flutter-apk/app-release.apk
