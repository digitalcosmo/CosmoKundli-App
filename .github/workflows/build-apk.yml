name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter project scaffolding
        run: flutter create --project-name cosmo_kundli .

      - name: Fix Android build configuration
        run: |
          echo "=== settings.gradle before ==="
          cat android/settings.gradle
          echo "=== build.gradle before ==="
          cat android/app/build.gradle
          echo "=== gradle-wrapper.properties before ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          # Update all version references in settings.gradle
          sed -i -E 's/(id\s+"com\.android\.application"\s+version\s+")[^"]+/\19.1.1/' android/settings.gradle
          sed -i -E 's/(id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+")[^"]+/\12.4.10/' android/settings.gradle
          # Also handle single-quote versions
          sed -i -E "s/(id 'com\.android\.application' version ')[^']+/\19.1.1/" android/settings.gradle
          sed -i -E "s/(id 'org\.jetbrains\.kotlin\.android' version ')[^']+/\12.4.10/" android/settings.gradle
          # Update ext.kotlin_version if present in build.gradle
          sed -i -E "s/ext\.kotlin_version\s*=\s*'[^']+'/ext.kotlin_version = '2.4.10'/" android/build.gradle 2>/dev/null || true
          # Update classpath references
          sed -i -E 's/com\.android\.tools\.build:gradle:[0-9.]+/com.android.tools.build:gradle:9.1.1/' android/build.gradle 2>/dev/null || true
          sed -i -E "s/org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]+/org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10/" android/build.gradle 2>/dev/null || true
          # Update gradle wrapper
          sed -i -E 's|gradle-[0-9.]+-all\.zip|gradle-9.3.1-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's|gradle-[0-9.]+-bin\.zip|gradle-9.3.1-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          echo "=== settings.gradle after ==="
          cat android/settings.gradle
          echo "=== gradle-wrapper.properties after ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CosmoKundli-APK
          path: build/app/outputs/flutter-apk/app-release.apk
