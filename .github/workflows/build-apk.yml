name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Family check (every stat, list and screen from the kit)
        run: bash tool/check_family.sh

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK (arm64, most phones)
        uses: actions/upload-artifact@v4
        with:
          name: CosmoKundli-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload APK (universal, any phone)
        uses: actions/upload-artifact@v4
        with:
          name: CosmoKundli-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
